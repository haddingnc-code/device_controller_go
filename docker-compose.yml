version: '3.8'

services:
  # Serviço da Base de Dados PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: devices_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: devices_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - devices-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devices_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Serviço da tua API em Go
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devices_go_api
    ports:
      - "8080:8080"
    environment:
      # Configurações que o teu pacote 'config.ConnectDatabase()' vai ler
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: mysecretpassword
      DB_NAME: devices_db
      GIN_MODE: release
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - devices-network

networks:
  devices-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
