basePath: /api/v1
definitions:
  domain.ApiError:
    properties:
      error:
        type: string
      message:
        type: string
      status:
        type: integer
      timestamp:
        type: string
    type: object
  domain.CursorPageResult:
    properties:
      content:
        items:
          $ref: '#/definitions/domain.Device'
        type: array
      hasNext:
        type: boolean
      nextCursor:
        type: integer
    type: object
  domain.Device:
    properties:
      brand:
        type: string
      creationTime:
        type: string
      id:
        type: integer
      name:
        type: string
      state:
        $ref: '#/definitions/domain.DeviceState'
    type: object
  domain.DeviceDTO:
    properties:
      brand:
        type: string
      name:
        type: string
      state:
        $ref: '#/definitions/domain.DeviceState'
    required:
    - brand
    - name
    - state
    type: object
  domain.DeviceState:
    enum:
    - AVAILABLE
    - IN_USE
    - INACTIVE
    type: string
    x-enum-varnames:
    - Available
    - InUse
    - Inactive
host: localhost:8080
info:
  contact: {}
  description: A REST API for persisting and managing device resources protected by
    AOP validation rules.
  title: Devices API
  version: "1.0"
paths:
  /devices:
    get:
      description: Retrieves a list of all existing devices with cursor-based pagination.
      parameters:
      - description: Pagination Limit
        in: query
        name: limit
        type: integer
      - description: Pagination Cursor ID
        format: int64
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CursorPageResult'
      summary: Fetch all devices
      tags:
      - devices
    post:
      consumes:
      - application/json
      description: Persists a new device resource into the database.
      parameters:
      - description: Device Payload
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/domain.DeviceDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Device'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Create a new device
      tags:
      - devices
  /devices/{id}:
    delete:
      description: Removes a device resource by ID. Fails if the device is currently
        IN_USE.
      parameters:
      - description: Device ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Delete a single device
      tags:
      - devices
    get:
      consumes:
      - application/json
      description: Retrieves a specific device resource matching the unique path variable
        identifier.
      parameters:
      - description: ID of the target device to find
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Device'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Fetch a single device by ID
      tags:
      - devices
    patch:
      consumes:
      - application/json
      description: Modifies specific payload key-value fields. Protected by active
        state guards.
      parameters:
      - description: ID of the target device
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Key-value properties map to update
        in: body
        name: updates
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Device'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ApiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Partially update an existing device
      tags:
      - devices
    put:
      consumes:
      - application/json
      description: Updates all properties of a device. Protected by AOP state rules.
      parameters:
      - description: Device ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Device Payload
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/domain.DeviceDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Device'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Fully update an existing device
      tags:
      - devices
  /devices/search/brand:
    get:
      consumes:
      - application/json
      description: Filters the device collection case-insensitively by brand starting
        after a target cursor ID.
      parameters:
      - description: Name of the device brand
        in: query
        name: brand
        required: true
        type: string
      - description: Max items to return (default 20)
        in: query
        name: limit
        type: integer
      - description: ID of the last item from the previous page (default 0)
        format: int64
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CursorPageResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Fetch devices by brand with cursor pagination
      tags:
      - devices
  /devices/search/state:
    get:
      consumes:
      - application/json
      description: Filters the device collection matching the target state enum starting
        after a target cursor ID.
      parameters:
      - description: Target state (AVAILABLE, IN_USE, INACTIVE)
        in: query
        name: state
        required: true
        type: string
      - description: Max items to return (default 20)
        in: query
        name: limit
        type: integer
      - description: ID of the last item from the previous page (default 0)
        format: int64
        in: query
        name: cursor
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CursorPageResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ApiError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ApiError'
      summary: Fetch devices by state with cursor pagination
      tags:
      - devices
swagger: "2.0"
